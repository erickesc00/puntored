services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: puntored
      MYSQL_USER: puntored
      MYSQL_PASSWORD: puntored
    ports:
      - '33060:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run prisma:seed && npm run start:dev"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://puntored:puntored@mysql:3306/puntored
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
