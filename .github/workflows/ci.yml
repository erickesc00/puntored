name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: puntored_ci
          MYSQL_USER: puntored
          MYSQL_PASSWORD: puntored
        ports:
          - 33060:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql://puntored:puntored@127.0.0.1:33060/puntored_ci
      COOKIE_SECRET: ci-cookie-secret-1234
      COOKIE_SECURE: 'false'
      PROVIDER_SHARED_SECRET: ci-provider-secret-1234
      PROVIDER_ACTOR_ID: provider:ci
      TEST_DATABASE_URL: mysql://puntored:puntored@127.0.0.1:33060/puntored_test_ci
      TEST_DATABASE_ADMIN_URL: mysql://root:root@127.0.0.1:33060/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
